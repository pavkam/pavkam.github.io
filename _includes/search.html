{% if site.post_search %}
<div class="overlay" id="search-overlay" hidden>
  <div class="overlay__frame">
    <span class="panel__tab">QUERY</span>

    <button class="overlay__exit" type="button" id="nav-search-exit" title="Close (ESC)">ESC</button>

    <label class="overlay__promptline" for="nav-search-input">
      <span class="overlay__prompt">&gt;</span>
      <input type="text" id="nav-search-input" placeholder="type to search_" autocomplete="off" spellcheck="false">
    </label>

    <ul class="filelist" id="search-results-container"></ul>
  </div>

  <script src="https://unpkg.com/simple-jekyll-search@latest/dest/simple-jekyll-search.min.js"></script>
  <script>
    var searchjson = '[ \
      {% for post in site.posts %} \
        { \
          "title"    : "{% if post.title != "" %}{{ post.title | strip_html | escape }}{% else %}{{ post.excerpt | strip_html | escape | strip }}{%endif%}", \
          "category" : "{{ post.tags | join: \', \' }}", \
          "url"      : "{{ site.baseurl }}{{ post.url }}", \
          "date"     : "{{ post.date | date: "%Y.%m.%d" | default: "1970.01.01" }}" \
        }, \
      {% endfor %} \
      {% for page in site.html_pages %}{% if page.title != "{title}" and page.title != "404 - Page not found" %} \
        { \
          "title"    : "{% if page.title != "" %}{{ page.title | strip_html | escape }}{% else %}{{ page.excerpt | strip_html | escape | strip }}{% endif %}", \
          "category" : "{% if page.tags %}{{ page.tags | join: \', \' }}{% else %}page{% endif %}", \
          "url"      : "{{ site.baseurl }}{{ page.url }}", \
          "date"     : "{{ page.date | date: '%Y.%m.%d' | default: "1970.01.01" }}" \
        }{% unless forloop.last %},{% endunless %} \
      {% endif %}{% endfor %} \
    ]';
    searchjson = JSON.parse(searchjson);

    SimpleJekyllSearch({
      searchInput: document.getElementById('nav-search-input'),
      resultsContainer: document.getElementById('search-results-container'),
      json: searchjson,
      searchResultTemplate: '<li class="filelist__row"><a class="filelist__link" href="{url}"><time class="filelist__date">{date}</time><span class="filelist__name">{title}</span></a></li>',
      noResultsText: '<li class="filelist__row filelist__row--empty">NO MATCHING SECTORS</li>'
    });
  </script>
</div>
{% endif %}
