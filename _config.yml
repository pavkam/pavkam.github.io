title: Thought Dumpster
description: Yet Another Internet Blog

# Required by absolute_url: without it the RSS feed, canonical tag
# and og: images all render as domain-less paths.
url: "https://pavkam.dev"

# Presence of this also enables the <link rel="alternate"> feed autodiscovery.
rss-description: "Yet Another Internet Blog"
navbar-links:
  About Me: "about"
  Tags: "tags"
  Feed: "feed.xml"
  Archive: "/alex.ciobanu.org/index.html"

avatar: "/assets/img/avatar.jpeg"
round-avatar: false

author: Alexandru Ciobanu
social-network-links:
  rss: true
  email: "alex+git@ciobanu.org"
  github: pavkam
  linkedin: ciobanua
  twitter: pavkamftw
share-links-active:
  linkedin: true

# Was nested under share-links-active, so site.url-pretty resolved to nil.
url-pretty: "pavkam.dev"
google_analytics: "UA-143067975-1"
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true
post_search: true
link-tags: true
title-separator: "-"

# --- 8-bit console palette -------------------------------------------------
# Every colour in assets/css/crt.css resolves from these. Retune here.
crt-bg: "#000a02"        # tube black, faint green cast
crt-panel: "#031207"     # raised panel fill
crt-green: "#33ff66"     # primary phosphor
crt-green-hi: "#ccffdb"  # hot phosphor / headings
crt-green-mid: "#19b347" # secondary text
crt-green-dim: "#0d7a33" # meta, labels
crt-line: "#0a4d22"      # rules, borders, pixel shadows
crt-amber: "#ffb000"     # sparing accent (string literals, warnings)

# Browser chrome / PWA colour
mobile-theme-col: "#000a02"

timezone: "Europe/Dublin"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5
kramdown:
  input: GFM
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docs/
plugins:
  - jekyll-paginate
  - jekyll-sitemap
